name: ci

# The forge's own gate. It is deliberately small and deliberately here rather than implied: this
# repository decides which obligations become work items in eighteen other repositories, and until a
# few minutes ago it had no tests of its own. A tool that files issues for a broken parser produces a
# board that agrees with itself, which is the failure mode the portfolio keeps hitting.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r requirements-dev.txt
      # File lists rather than `.`. The directory used to carry 28 probe_* scratch scripts holding 152
      # ruff findings, which made a whole-tree gate red on arrival and therefore ignorable; they are
      # deleted, and test_templates.py now fails if any return. forge.py and names.py stay out of
      # `format --check` for the opposite reason: their template strings' wrapping becomes the generated
      # source of every project, so reformatting them is a cross-repo change dressed as a lint run.
      - run: python -m ruff check forge.py names.py verify.py sync_roadmap.py check_hygiene.py planner.py test_sync_roadmap.py test_check_hygiene.py test_planner.py test_templates.py ghprojects.py test_ghprojects.py deps.py test_deps.py test_forge_plan.py rowdoc.py test_rowdoc.py board.py test_board.py portfolio.py test_portfolio.py roadmap.py test_roadmap.py test_verify.py projects_mcp.py test_projects_mcp.py test_forge_guard.py leases.py test_leases.py evidence_check.py test_evidence_check.py mutate.py test_mutate.py
      # Format is gated only on the files that are plain code. forge.py and names.py would both be
      # reformatted, and they hold the template strings whose wrapping becomes the generated source of
      # eighteen repositories: reformatting them is a change to every project, made from a CI job that
      # looks like a lint run. That trade is not this gate's to make.
      - run: python -m ruff format --check sync_roadmap.py verify.py check_hygiene.py planner.py test_sync_roadmap.py test_check_hygiene.py test_planner.py test_templates.py ghprojects.py test_ghprojects.py deps.py test_deps.py test_forge_plan.py rowdoc.py test_rowdoc.py board.py test_board.py portfolio.py test_portfolio.py roadmap.py test_roadmap.py test_verify.py projects_mcp.py test_projects_mcp.py leases.py test_leases.py evidence_check.py test_evidence_check.py mutate.py test_mutate.py
      - run: python -m mypy sync_roadmap.py check_hygiene.py planner.py ghprojects.py deps.py rowdoc.py board.py portfolio.py roadmap.py projects_mcp.py leases.py evidence_check.py mutate.py
      # The real tests, in one place. This used to be a heredoc duplicating assertions that also lived
      # in a scratch file, and the two drifted on the very commit that added them.
      - run: python -m pytest -q test_sync_roadmap.py test_check_hygiene.py test_planner.py test_templates.py test_ghprojects.py test_deps.py test_forge_plan.py test_rowdoc.py test_board.py test_portfolio.py test_roadmap.py test_verify.py test_projects_mcp.py test_forge_guard.py test_leases.py test_evidence_check.py test_mutate.py
